name: scele-course-tracker
services:
  app:
    build: .
    image: local/scele-course-tracker:1.1.0
    container_name: scele-course-tracker
    user: "1002:1002"
    labels:
      taruna-kuma.app.docker.name: "SCeLE Course Tracker"
      taruna-kuma.app.docker.docker_container: "scele-course-tracker"
      taruna-kuma.app.docker.docker_host_name: "fhai"
      taruna-kuma.app.docker.interval: "60"
      taruna-kuma.app.docker.max_retries: "2"
    restart: unless-stopped
    env_file: .env
    environment:
      CACHE_DB_PATH: /app/data/cache.sqlite
      MOODLE_ACCOUNTS_FILE: /app/config/accounts.json
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    networks:
      proxy:
        ipv4_address: 192.168.176.51
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  proxy:
    external: true
    name: taruna-caddy-proxy
